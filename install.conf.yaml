- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.config/helix/config.toml: helix/config.toml
    ~/.config/helix/languages.toml: helix/languages.toml
    ~/.config/jj/config.toml: jj/config.toml
    ~/.config/mise/config.toml: mise/config.toml
    ~/.config/starship.toml: starship/starship.toml
    ~/.vimrc: vim/vimrc
    ~/.ideavimrc: ideavim/ideavimrc
    ~/.config/fish/config.fish: fish/config.fish
    ~/.config/fish/fish_plugins: fish/fish_plugins
    ~/.config/fish/functions/lsbr.fish: fish/functions/lsbr.fish
    ~/.config/fish/functions/y.fish: fish/functions/y.fish
    ~/.config/atuin/config.toml: atuin/config.toml
    ~/.config/git/config: git/config
    ~/.config/git/ignore: git/ignore
    # ~/.config/emacs/init.el: config/emacs/init.el
    # ~/.config/emacs/early-init.el: config/emacs/early-init.el

# These are only used on macOS
- link:
    ~/.Brewfile:
      path: homebrew/Brewfile
      if: '[ "$(uname)" = Darwin ]'
    ~/.config/ghostty/config:
      path: ghostty/config
      if: '[ "$(uname)" = Darwin ]'
    ~/.config/zed/keymap.json:
      path: zed/keymap.json
      if: '[ "$(uname)" = Darwin ]'
    ~/.config/zed/settings.json:
      path: zed/settings.json
      if: '[ "$(uname)" = Darwin ]'
    ~/.gnupg/gpg-agent.conf:
      path: gnupg/gpg-agent.conf
      if: '[ "$(uname)" = Darwin ]'
    ~/.config/rex/init.lua:
      path: rex/init.lua
      if: '[ "$(uname)" = Darwin ]'
    ~/.config/rex/rexdiff.lua:
      path: rex/rexdiff.lua
      if: '[ "$(uname)" = Darwin ]'

# note: run fish_plugins installer
# note: run helix/install.sh to build Helix from source

# Tools with their own installers, so they work the same on macOS and Linux.
# Each step skips tools that are already installed; update them with
# claude update, rustup update, uv self update, mise self-update, mise upgrade
# and uv tool upgrade --all.
- shell:
  - command: test -x ~/.local/bin/claude || curl -fsSL https://claude.ai/install.sh | bash
    description: Installing Claude Code
  - command: test -x ~/.cargo/bin/rustup || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
    description: Installing rustup
  - [~/.cargo/bin/rustup component add rust-analyzer, Installing rust-analyzer]
  - command: test -x ~/.local/bin/uv || curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
    description: Installing uv
  - command: test -x ~/.local/bin/mise || curl -fsSL https://mise.run | sh
    description: Installing mise
  - [~/.local/bin/mise install --yes, Installing tools from mise/config.toml]
  - ['~/.local/bin/uv tool install "harlequin[postgres]"', Installing harlequin]
  - [~/.local/bin/uv tool install ansible --with-executables-from ansible-core, Installing ansible]
