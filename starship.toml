# Only the modules listed here run, which keeps the prompt fast in big repos.
# $username and $hostname only show over SSH. fish hides the right prompt
# when the command you're typing reaches it.
format = "$username$hostname$directory$git_branch$git_state$git_status$character"
right_format = "$kubernetes$aws$cmd_duration$jobs"
# git status in a big repo like ElastiCore can pass the default 500 ms on a cold cache
command_timeout = 1000

[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](red)"

[directory]
truncation_length = 4
truncate_to_repo = false

[git_branch]
format = "[$branch]($style) "
style = "bright-black"

[git_status]
style = "cyan"

[kubernetes]
disabled = false
format = "[⎈ $context( \\($namespace\\))]($style) "
style = "blue"

[aws]
format = "[aws $profile( $region)]($style) "
style = "yellow"

[cmd_duration]
min_time = 5000
style = "yellow"
