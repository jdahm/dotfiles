# Command-line tools for macOS and Linux. They're on PATH through mise's shims
# (see fish/config.fish). Install with `mise install`, update with `mise upgrade`.
# Projects that need a specific version pin it in their own mise.toml.
[tools]
go = "latest"
node = "latest"

gh = "latest"
git-town = "latest"
delta = "latest"

jq = "latest"
yq = "latest"
just = "latest"
ripgrep = "latest"
eza = "latest"
glow = "latest"
zoxide = "latest"
starship = "latest"

# Rust replacements for classic tools
bat = "latest"
fd = "latest"
dust = "latest"
bottom = "latest"
sd = "latest"
xh = "latest"
hyperfine = "latest"
tealdeer = "latest"
yazi = "latest"
difftastic = "latest"
atuin = "latest"

# Coding agents
pi = "latest"
codex = "latest"

awscli = "latest"
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
helm = "latest"
k9s = "latest"
opentofu = "latest"
neonctl = "latest"
"npm:vercel" = "latest"
"npm:prettier" = "latest"

# Language servers for Helix, which doesn't download its own
"go:golang.org/x/tools/gopls" = "latest"
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"github:docker/docker-language-server" = "latest"
marksman = "latest"
ruff = "latest"
ty = "latest"
taplo = "latest"
"npm:yaml-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:bash-language-server" = "latest"
"npm:fish-lsp" = "latest"

[settings]
env_file = ".env"
# The following ensures we use a global GOBIN ($GOPATH/bin and GOPATH defaults to $HOME/go) but
# Use the compiler version specified by mise.
go_set_gobin = false
go_set_goroot = true
